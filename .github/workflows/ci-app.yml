# CI do aplicativo (P00). Roda em todo PR para main e em push na main.
# Sem secrets: nenhum job recebe credencial de homologação/produção. Actions fixadas por SHA.
# Runner fixado em ubuntu-24.04: ubuntu-latest migra para Ubuntu 26 a partir de 19/10/2026.
# Não usar `|| true`, --passWithNoTests ou mocks no lugar do banco (docs/09).
name: app-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: lint · typecheck · unit · contratos · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:contracts
      - run: npm run build
      - run: npm run test:coord
      - name: Dependências sem vulnerabilidade crítica
        run: npm audit --omit=dev --audit-level=critical

  functions:
    name: edge functions (deno check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: deno check --frozen --config supabase/functions/deno.json supabase/functions/*/index.ts

  database:
    name: banco (migrations do zero · seed · pgTAP/RLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sobe só o Postgres do Supabase local
        run: npx --no-install supabase db start
      - name: Aplica migrations do zero e seed sintético
        run: npx --no-install supabase db reset --local
      - name: Testes pgTAP (isolamento, autorização, idempotência)
        run: npx --no-install supabase test db
      - name: Lint de schema
        run: npx --no-install supabase db lint --local --level error --fail-on error
      - if: always()
        run: npx --no-install supabase stop --no-backup
      # Concorrência real (várias conexões): Postgres 16 do runner + shim, como `db:test:local`.
      - name: Concorrência (idempotência e corridas sob várias conexões)
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-16-pgtap
          sudo systemctl start postgresql
          sudo -u postgres psql -qXc "alter user postgres password 'postgres'"
          npm run db:test:concurrency
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres

  e2e:
    name: e2e smoke (desktop + mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    name: varredura de segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Sem --log-opts o gitleaks lê `git log --all`: com fetch-depth 0 isso inclui as branches
      # de outras sessões, e um achado alheio bloquearia este PR. Em PR: só os commits do PR
      # (base..merge). Em push na main: todo o histórico alcançável pela main.
      - name: gitleaks
        env:
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '--full-history HEAD' }}
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1 --log-opts="$LOG_OPTS"
