# CI do aplicativo (P00). Roda em todo PR para main e em push na main.
# Os cinco jobs abaixo são os checks obrigatórios do merge (docs/09, "Checks obrigatórios do CI"); renomear um job
# exige atualizar a regra da main no GitHub.
# Sem secrets: nenhum job recebe credencial de homologação/produção. Actions fixadas por SHA.
# Runner fixado em ubuntu-24.04: ubuntu-latest migra para Ubuntu 26 a partir de 19/10/2026.
# Não usar `|| true`, --passWithNoTests ou mocks no lugar do banco (docs/09).
#
# Portão de merge (decisão D38 (a)): os CINCO jobs abaixo são os checks obrigatórios da proteção da `main`, com zero
# aprovações exigidas. Os nomes que a proteção de branch usa são os `name:` de cada job:
#   1. lint · typecheck · unit · contratos · build        (app-quality)
#   2. edge functions (deno check)                        (functions)
#   3. banco (migrations do zero · seed · pgTAP/RLS)      (database: inclui ordem das migrations, números de teste
#                                                          repetidos, concorrência, integração, dicionário e restore)
#   4. e2e smoke (desktop + mobile)                       (e2e: demonstração e jornada do ciclo com servidor)
#   5. varredura de segredos                              (secrets)
# Mudou o nome de um job? Atualize a proteção de branch no mesmo PR, ou o merge fica bloqueado esperando um check
# que não existe mais. Não crie um sexto job para algo que cabe num dos cinco.
name: app-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: lint · typecheck · unit · contratos · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:contracts
      - run: npm run build
      - run: npm run test:coord
      - name: Dependências sem vulnerabilidade crítica
        run: npm audit --omit=dev --audit-level=critical

  functions:
    name: edge functions (deno check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: deno check --frozen --config supabase/functions/deno.json supabase/functions/*/index.ts

  database:
    name: banco (migrations do zero · seed · pgTAP/RLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico para comparar as migrations com a base (main no PR; commit anterior no push).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Linha R da revisão de 10/11: migration com data anterior às da main e pgTAP com número repetido passavam em
      # cada PR sozinho e quebravam a ordem depois do merge. Falha antes de gastar tempo com o banco.
      - name: Ordem das migrations e números de teste repetidos
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          node .github/workflows/check-migrations.mjs --self-test
          node .github/workflows/check-migrations.mjs --base "$BASE"
      - run: npm ci
      - name: Sobe só o Postgres do Supabase local
        run: npx --no-install supabase db start
      - name: Aplica migrations do zero e seed sintético
        run: npx --no-install supabase db reset --local
      - name: Testes pgTAP (isolamento, autorização, idempotência)
        run: npx --no-install supabase test db
      - name: Lint de schema
        run: npx --no-install supabase db lint --local --level error --fail-on error
      - if: always()
        run: npx --no-install supabase stop --no-backup
      # Concorrência real (várias conexões): Postgres 16 do runner + shim, como `db:test:local`.
      - name: Concorrência (idempotência e corridas sob várias conexões)
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-16-pgtap
          sudo systemctl start postgresql
          sudo -u postgres psql -qXc "alter user postgres password 'postgres'"
          npm run db:test:concurrency
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
      # P10: cada Edge Function montada com a lógica de produção chamando as RPCs no Postgres (sem mock de RPC).
      - name: Integração handler ↔ banco (UATs e matriz SEC pelos handlers)
        run: npm run test:integration
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
      # be-banco-09: docs/02_DICIONARIO.md é gerado do catálogo; falha se ficou diferente do banco das migrations.
      - name: Dicionário do banco igual às migrations
        run: bash .github/workflows/db-dictionary.sh --check
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
      # Recado #109: o script de publicação aplica as migrations num banco descartável pelo mesmo `supabase db push`
      # que usa na homologação, e o smoke confere o resultado. Pega erro no script antes do Gabriel publicar.
      - name: Publicação no banco local (release/publicar.sh local)
        run: |
          psql -qXc "create database tinindo_publicar"
          psql -d tinindo_publicar -qX -v ON_ERROR_STOP=1 -c "alter database tinindo_publicar set search_path = \"\$user\", public, extensions" -f scripts/db-local/supabase_shim.sql >/dev/null
          bash release/publicar.sh local
          bash release/publicar.sh local | grep -q "nada a aplicar"
          EXIGE_MAIN=0 bash release/publicar.sh homolog --conferir
          EXIGE_MAIN=0 bash release/reverter.sh homolog origin/main~1 --conferir
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          LOCAL_DB: tinindo_publicar
      # P58: smoke com a saúde da operação (ok e reprovando com o alerta aceso), reversão, travas de produção e o ensaio
      # de backup e restore do ambiente, com o tempo no resumo da execução.
      - name: Operação (smoke com alerta, reverter, travas de produção, ensaio de restore)
        run: |
          bash release/testes-locais.sh
          bash release/ensaio-restore.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          LOCAL_DB: tinindo_publicar
      # OPS-01: dump, restore em banco novo, integridade e app utilizável, com tempo medido.
      - name: Ensaio de restore (OPS-01)
        run: npm run db:restore:drill
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres

  e2e:
    name: e2e smoke (desktop + mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # WebKit: projeto "iphone" (Safari do iPhone) no ciclo principal; o nome do job fica, por ser check obrigatório.
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run build
      # P51 (D4): no PR, os e2e dos módulos guardados ficam de fora; na `main` roda tudo (playwright.config.ts).
      - run: npm run test:e2e
        env:
          E2E_PILOTO: ${{ github.event_name == 'pull_request' && '1' || '' }}
      # P59 · jornada do ciclo (agendar, atender, receber, retorno) na tela, com gravação real: build com servidor,
      # gateway de teste montando os handlers de produção e o Postgres do runner (tests/e2e/servidor/README.md).
      - name: Postgres 16 do runner para a jornada com servidor
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-16-pgtap
          sudo systemctl start postgresql
          sudo -u postgres psql -qXc "alter user postgres password 'postgres'"
      - name: Jornada do ciclo com servidor (desktop + mobile)
        run: bash tests/e2e/servidor/run.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/servidor
          retention-days: 7

  secrets:
    name: varredura de segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Sem --log-opts o gitleaks lê `git log --all`: com fetch-depth 0 isso inclui as branches
      # de outras sessões, e um achado alheio bloquearia este PR. Em PR: só os commits do PR
      # (base..merge). Em push na main: todo o histórico alcançável pela main.
      - name: gitleaks
        env:
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '--full-history HEAD' }}
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1 --log-opts="$LOG_OPTS"
