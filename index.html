<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <!-- Cor da barra do navegador por tema (item 22): papel-50 no claro, tinta-950 no escuro (tokens da marca). -->
    <meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- Instalável na tela inicial: abre em tela cheia no /app (ADR-0024). Cores = tokens papel-50 e tinta-950. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>@media (prefers-color-scheme: dark) { .tn-splash { background: #111111 !important; } }</style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tinindo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Prévia do link (WhatsApp, redes). Padrão genérico; em /p/:slug e /s/:slug o Worker troca este bloco pelo
         perfil publicado (worker/og.ts). Manter os marcadores og:start e og:end. -->
    <!-- og:start -->
    <title>Tinindo</title>
    <meta name="description" content="Agenda, clientes e dinheiro do seu negócio em ordem." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tinindo" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Tinindo" />
    <meta property="og:description" content="Agenda, clientes e dinheiro do seu negócio em ordem." />
    <meta property="og:image" content="/og/previa.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:end -->
  </head>
  <body>
    <!-- Tela de abertura (P34): aparece enquanto o pacote do app baixa e some quando o React monta (createRoot troca o
         conteúdo do #root). Só a wordmark original da marca sobre o fundo do tema; nada que dependa de script. -->
    <div id="root"><div class="tn-splash" style="min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#F7F7F5"><picture><source srcset="/brand/wordmark-negativo.svg" media="(prefers-color-scheme: dark)" /><img src="/brand/wordmark.svg" width="160" height="41" alt="Tinindo" style="display:block;height:auto" /></picture></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
