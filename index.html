<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- Instalável na tela inicial: abre em tela cheia no /app (ADR-0024). Cores = tokens papel-50 e tinta-950. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tinindo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Prévia do link (WhatsApp, redes). Padrão genérico; em /p/:slug e /s/:slug o Worker troca este bloco pelo
         perfil publicado (worker/og.ts). Manter os marcadores og:start e og:end. -->
    <!-- og:start -->
    <title>Tinindo</title>
    <meta name="description" content="Agenda, clientes e dinheiro do seu negócio em ordem." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tinindo" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Tinindo" />
    <meta property="og:description" content="Agenda, clientes e dinheiro do seu negócio em ordem." />
    <meta property="og:image" content="/icons/app-icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- og:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
